name: Test Shoogle
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "index.html"
      - "docs/index.html"
      - "openapi.json"
      - "AGENTS.md"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
